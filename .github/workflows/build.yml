name: Build StockKeeper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 4. System dependencies
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # 5. Install Buildozer + Cython
      # ==========================================
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython


      # ==========================================
      # 6. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          rm -rf cmdline-tools

          unzip -q commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "SDK:"
          echo "$SDK"

          echo
          echo "SDKMANAGER:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ==========================================
      # 7. Accept Android licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"

          yes | sdkmanager --licenses || true

          mkdir -p "$ANDROID_SDK_ROOT/licenses"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"


      # ==========================================
      # 8. Install Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          echo "================================"
          echo "SDKMANAGER LIST"
          echo "================================"

          sdkmanager --list > /tmp/sdk-list.txt

          head -100 /tmp/sdk-list.txt

          echo
          echo "================================"
          echo "INSTALL SDK PACKAGES"
          echo "================================"

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"


      # ==========================================
      # 9. Verify Android SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          echo "================================"
          echo "SDKMANAGER VERSION"
          echo "================================"

          sdkmanager --version

          echo
          echo "================================"
          echo "INSTALLED PACKAGES"
          echo "================================"

          sdkmanager --list_installed

          echo
          echo "================================"
          echo "BUILD TOOLS"
          echo "================================"

          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "================================"
          echo "ANDROID PLATFORM"
          echo "================================"

          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "================================"
          echo "PLATFORM TOOLS"
          echo "================================"

          ls -la "$ANDROID_SDK_ROOT/platform-tools"

          echo
          echo "================================"
          echo "NDK"
          echo "================================"

          ls -la "$ANDROID_SDK_ROOT/ndk"


      # ==========================================
      # 10. Prepare StockKeeper
      # ==========================================
      - name: Prepare StockKeeper
        shell: bash
        run: |
          set -eux

          if [ -f "StockKeeper.py" ]; then
            cp "StockKeeper.py" "main.py"
          fi

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -la


      # ==========================================
      # 11. Verify Java
      # ==========================================
      - name: Verify Java
        shell: bash
        run: |
          set -eux

          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          javac -version


      # ==========================================
      # 12. Clean Buildozer
      # ==========================================
      - name: Clean Buildozer
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin


      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build StockKeeper APK
        shell: bash
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          set -eux

          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "================================"
          echo "FINAL ENVIRONMENT"
          echo "================================"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "JAVA:"
          java -version

          echo
          echo "SDKMANAGER:"
          sdkmanager --version

          echo
          echo "BUILD TOOLS:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "BUILD"
          echo "================================"

          buildozer android debug


      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
