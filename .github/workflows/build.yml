name: Build StockKeeper APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev libltdl-dev build-essential

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Prepare main.py
        run: |
          cp StockKeeper.py main.py
          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          set -o pipefail
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: bin/*.apk
          if-no-files-found: error
