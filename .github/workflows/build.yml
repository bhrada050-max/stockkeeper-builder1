name: Build StockKeeper APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'status.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev libltdl-dev build-essential

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Prepare main.py
        run: |
          cp StockKeeper.py main.py
          test -f main.py
          test -f buildozer.spec

      - name: Check Python syntax
        run: |
          python -m py_compile \
            StockKeeper.py rtl_fix.py \
            sk_part_a.py sk_part_b.py sk_part_c.py \
            desc_ui.py maintenance.py
          echo "All Python files passed syntax check"

      - name: Build APK
        run: |
          set -o pipefail
          rm -rf .buildozer bin
          (yes || true) | buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "========== ERROR KEYWORDS =========="
          grep -aEin -C 4 \
            'Traceback|ModuleNotFoundError|SyntaxError|IndentationError|fatal error:|error:|Exception:|FAILED|BUILD FAILED|No matching distribution|not found|undefined reference|CMake Error|Could not' \
            build.log | tail -180 || true

          echo "========== LAST 160 LINES =========="
          tail -160 build.log

          echo "========== PYTHON FILE SYNTAX =========="
          python -m py_compile \
            main.py rtl_fix.py sk_part_a.py sk_part_b.py \
            sk_part_c.py desc_ui.py maintenance.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: bin/*.apk
          if-no-files-found: error
