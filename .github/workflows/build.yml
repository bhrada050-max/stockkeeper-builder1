name: Build StockKeeper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rename StockKeeper.py to main.py
        run: |
          if [ -f StockKeeper.py ]; then
            cp StockKeeper.py main.py
          fi

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
