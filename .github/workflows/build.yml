name: Build StockKeeper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 4. System dependencies
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # 5. Buildozer + Cython
      # ==========================================
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython


      # ==========================================
      # 6. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O commandlinetools.zip

          rm -rf cmdline-tools

          unzip -q commandlinetools.zip

          mv cmdline-tools "$SDK/cmdline-tools/latest"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          # Environment variables
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "================================"
          echo "SDKMANAGER CHECK"
          echo "================================"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version


      # ==========================================
      # 7. Create Buildozer-compatible sdkmanager
      # ==========================================
      - name: Configure Buildozer SDK path
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"

          # Buildozer expects:
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Copy the complete command-line-tools directory
          # into the legacy tools directory.

          rm -rf "$SDK/tools"

          mkdir -p "$SDK/tools"

          cp -a "$SDK/cmdline-tools/latest/." "$SDK/tools/"

          chmod +x "$SDK/tools/bin/"*

          echo "================================"
          echo "BUILDOZER SDKMANAGER"
          echo "================================"

          ls -la "$SDK/tools/bin"

          "$SDK/tools/bin/sdkmanager" --version


      # ==========================================
      # 8. Android licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"

          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses || true

          mkdir -p "$ANDROID_SDK_ROOT/licenses"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"


      # ==========================================
      # 9. Install SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "================================"
          echo "SDKMANAGER VERSION"
          echo "================================"

          "$SDKMANAGER" --version

          echo
          echo "================================"
          echo "INSTALL PACKAGES"
          echo "================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"


      # ==========================================
      # 10. Verify SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"

          echo "================================"
          echo "SDKMANAGER"
          echo "================================"

          "$SDK/tools/bin/sdkmanager" --version

          echo
          echo "================================"
          echo "BUILD TOOLS"
          echo "================================"

          test -d "$SDK/build-tools/34.0.0"

          ls -la "$SDK/build-tools/34.0.0"

          echo
          echo "================================"
          echo "ANDROID 34"
          echo "================================"

          test -d "$SDK/platforms/android-34"

          echo
          echo "================================"
          echo "PLATFORM TOOLS"
          echo "================================"

          test -f "$SDK/platform-tools/adb"

          echo
          echo "================================"
          echo "NDK"
          echo "================================"

          test -d "$SDK/ndk/25.2.9519653"

          echo
          echo "ANDROID SDK OK"


      # ==========================================
      # 11. Prepare project
      # ==========================================
      - name: Prepare StockKeeper
        shell: bash
        run: |
          set -eux

          if [ -f "StockKeeper.py" ]; then
            cp "StockKeeper.py" "main.py"
          fi

          test -f "main.py"

          echo "================================"
          echo "PROJECT"
          echo "================================"

          ls -la


      # ==========================================
      # 12. Verify Java
      # ==========================================
      - name: Verify Java
        shell: bash
        run: |
          set -eux

          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version


      # ==========================================
      # 13. Clean Buildozer
      # ==========================================
      - name: Clean Buildozer
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin


      # ==========================================
      # 14. Build APK
      # ==========================================
      - name: Build StockKeeper APK
        shell: bash
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          set -eux

          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "================================"
          echo "FINAL ENVIRONMENT"
          echo "================================"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "JAVA:"
          java -version

          echo
          echo "BUILDOZER SDKMANAGER:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo
          echo "BUILD TOOLS:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "BUILD APK"
          echo "================================"

          buildozer android debug


      # ==========================================
      # 15. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
