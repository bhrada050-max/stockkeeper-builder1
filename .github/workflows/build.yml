name: Build StockKeeper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython

      - name: Setup Android SDK
        shell: bash
        run: |
          set -eux
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/tools/bin"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip
          rm -rf "$SDK/cmdline-tools/latest"
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          chmod +x "$SDK/cmdline-tools/latest/bin/"*
          for tool in sdkmanager avdmanager; do
            cat > "$SDK/tools/bin/$tool" <<EOF
          #!/bin/bash
          exec "$SDK/cmdline-tools/latest/bin/$tool" --sdk_root="$SDK" "\$@"
          EOF
            chmod +x "$SDK/tools/bin/$tool"
          done
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "===== SDKMANAGER VERSION ====="
          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set -eux
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p "$SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | "$SDK/tools/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "===== INSTALLED ====="
          ls -la "$SDK/platforms" "$SDK/build-tools" || true

      - name: Prepare application
        shell: bash
        run: |
          set -eux
          if [ -f StockKeeper.py ]; then
            cp StockKeeper.py main.py
          fi
          test -f main.py
          ls -la

      - name: Verify Java
        shell: bash
        run: |
          set -eux
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Clean Buildozer cache
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          set -eux
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "===== FINAL ENVIRONMENT ====="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          echo "===== BUILD ====="
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockKeeper-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
